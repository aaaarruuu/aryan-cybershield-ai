# ARYAN CYBERSHIELD AI - Developed by Aryan
# Usage: cp .env.example .env  (edit secrets)  &&  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cybershield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cybershield
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybershield -d cybershield"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No published port: the database is reachable only from the compose network.

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (32+ random characters)}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      DATABASE_URL: postgresql+psycopg://cybershield:${POSTGRES_PASSWORD}@db:5432/cybershield
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DEMO_MODE: ${DEMO_MODE:-true}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      CHROMA_PATH: /data/chroma
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-10}
    volumes:
      - chroma:/data/chroma
      - mlartifacts:/srv/backend/app/ml/artifacts

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  chroma:
  mlartifacts:
